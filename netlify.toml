# Netlify Configuration for Rocket Learners Attendance App

[build]
  publish = "."

# Direct root to the main frontend application
[[redirects]]
  from = "/"
  to = "/front-end/diem-danh-lop-hoc.html"
  status = 200

# Proxy /api requests to your live backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://attendance-class-api.onrender.com/api/:splat"
  status = 200
  force = true
