services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: attendance_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_fastapi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/attendance_db
      PROJECT_NAME: "Sổ Điểm Danh API"
      API_V1_STR: "/api"
      SECRET_KEY: "super_secret_jwt_key_change_in_production_please_generate_random_key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 525600
      USE_SQLITE_FALLBACK: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
